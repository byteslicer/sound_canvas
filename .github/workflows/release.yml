name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens/updates a "release PR" from conventional commits. Merging that PR
  # creates the git tag + GitHub release, which then triggers the builds below.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    name: Build macOS artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      runner: macos-15-intel
      archs: "arm64;x86_64"

  build-linux:
    name: Build Linux artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    name: Build Windows artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-windows.yml

  # Collects every platform's artifacts and attaches them to the release.
  publish:
    name: Attach artifacts to release
    needs: [release-please, build-macos, build-linux, build-windows]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          set -euo pipefail
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}-${{ needs.release-please.outputs.tag_name }}.zip" .)
          done
          cd ..
          sha256sum artifacts/*.zip > artifacts/SHA256SUMS.txt
          ls -la artifacts

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            artifacts/*.zip artifacts/SHA256SUMS.txt \
            --clobber
