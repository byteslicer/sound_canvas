name: Build macOS

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: macos-15-intel
      archs:
        type: string
        required: false
        default: "arm64;x86_64"
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        required: false
        default: macos-15-intel
      archs:
        description: "CMAKE_OSX_ARCHITECTURES"
        required: false
        default: "arm64;x86_64"

jobs:
  macos:
    name: macOS (universal VST3 + Standalone)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    env:
      CMAKE_OSX_ARCHITECTURES: ${{ inputs.archs || 'arm64;x86_64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build-macos/_deps
          key: juce-8.0.4-${{ runner.os }}
          restore-keys: |
            juce-8.0.4-

      - name: Build
        run: bash scripts/build_macos.sh

      - name: Verify architectures
        run: |
          find dist/macos -path '*/Contents/MacOS/*' -type f -print0 | \
            while IFS= read -r -d '' bin; do
              printf '%s -> ' "$bin"
              lipo -archs "$bin"
            done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCanvas-macOS
          path: dist/macos
          if-no-files-found: error
