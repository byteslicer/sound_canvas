name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build-windows/_deps
          key: juce-8.0.4-${{ runner.os }}
          restore-keys: |
            juce-8.0.4-

      - name: Build
        run: pwsh -NoProfile -File scripts/build_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCanvas-windows
          path: dist/windows
          if-no-files-found: error
