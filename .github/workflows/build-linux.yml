name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (VST3 + Standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libx11-xcb-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build-linux/_deps
          key: juce-8.0.4-${{ runner.os }}
          restore-keys: |
            juce-8.0.4-

      - name: Build
        run: bash scripts/build_linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCanvas-linux
          path: dist/linux
          if-no-files-found: error
